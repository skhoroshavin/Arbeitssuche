name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.7)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write
  pull-requests: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: electron:dist:mac:arm64
            artifact: mac-arm64
          - os: macos-latest
            script: electron:dist:mac:x64
            artifact: mac-x64
          - os: ubuntu-latest
            script: electron:dist:linux
            artifact: linux-x64
          - os: windows-latest
            script: electron:dist:win
            artifact: win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build & package
        run: npm run ${{ matrix.script }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.exe
          if-no-files-found: error

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release (draft)
        uses: softprops/action-gh-release@26e8ad27a09a225049a7075d7ec1caa2df6ff332 # v2.6.0
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ !contains(env.RELEASE_TAG, '-') }}
          files: artifacts/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ env.RELEASE_TAG }}" --draft=false

  dev-bump:
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Bump to next dev version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DEV_VERSION=$(npx tsx scripts/bump-version.ts dev --no-git)
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/bump-dev-v${DEV_VERSION}"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists — skipping dev bump"
            exit 0
          fi
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "Bump version to ${DEV_VERSION}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Bump version to ${DEV_VERSION}" \
            --body "Automated post-release version bump to \`${DEV_VERSION}\`." \
            --base main
