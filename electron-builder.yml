appId: com.arbeitssuche.app
productName: Arbeitssuche
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
  output: dist
npmRebuild: true
files:
  - out/**/*
electronLanguages:
  - en
  - de
afterPack: scripts/ad-hoc-sign.js
mac:
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.business
win:
  target:
    - target: nsis
      arch:
        - x64
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office
